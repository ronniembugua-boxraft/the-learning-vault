<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="680" height="320" rx="10" fill="#FAFAFA"/><text x="22" y="30" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Blocking</text><text x="22" y="50" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Staging bodies in space, before the camera is placed</text><rect x="90" y="80" width="500" height="180" rx="4" fill="#fff" stroke="#E2E2E2"/><rect x="90" y="80" width="70" height="180" fill="#ABABAB" opacity="0.25"/><text x="125" y="72" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">door</text><rect x="520" y="80" width="70" height="180" fill="#ABABAB" opacity="0.25"/><text x="555" y="72" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">window</text><circle cx="215" cy="200" r="15" fill="#7A7A7A"/><text x="215" y="232" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">A start</text><circle cx="400" cy="140" r="15" fill="#141414"/><text x="400" y="116" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">A end</text><path d="M 232 194 C 290 186, 340 160, 384 146" fill="none" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><circle cx="470" cy="205" r="15" fill="#141414"/><text x="470" y="236" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="700" font-style="">B</text><line x1="415" y1="150" x2="455" y2="196" stroke="#E2E2E2"/><g transform="translate(340,292) rotate(-90) scale(0.85)"><rect x="-13" y="-9" width="20" height="18" rx="2.5" fill="#2E2E2E"/><path d="M7,-6 L16,-10 L16,10 L7,6 Z" fill="#2E2E2E"/></g><text x="340" y="300" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#141414" text-anchor="start" font-weight="400" font-style=""></text><text x="22" y="280" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">A crosses toward the window and forces B to turn. The move is the scene — it happens before a word is said.</text><text x="22" y="302" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Block first, then light and shoot. Deciding camera first makes actors serve the lens, and it shows.</text></svg>