<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="640" height="300" rx="10" fill="#FAFAFA"/><text x="22" y="30" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Truck</text><text x="22" y="50" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Overhead view — camera moves left or right through space</text><circle cx="330" cy="165" r="13" fill="#141414"/><text x="330" y="197" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="700" font-style="">SUBJECT</text><g transform="translate(200,255) rotate(-90) scale(0.9)"><rect x="-13" y="-9" width="20" height="18" rx="2.5" fill="#7A7A7A"/><path d="M7,-6 L16,-10 L16,10 L7,6 Z" fill="#7A7A7A"/></g><g transform="translate(430,255) rotate(-90) scale(1)"><rect x="-13" y="-9" width="20" height="18" rx="2.5" fill="#2E2E2E"/><path d="M7,-6 L16,-10 L16,10 L7,6 Z" fill="#2E2E2E"/></g><line x1="222" y1="255" x2="408" y2="255" stroke="#2E2E2E" stroke-width="2" marker-end="url(#a)"/><text x="315" y="278" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#2E2E2E" text-anchor="middle" font-weight="600" font-style="">camera travels laterally</text><line x1="330" y1="187" x2="330" y2="238" stroke="#E2E2E2" stroke-dasharray="3 3"/><text x="22" y="282" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Travels alongside a subject, holding the relationship while the world slides past behind them.</text></svg>