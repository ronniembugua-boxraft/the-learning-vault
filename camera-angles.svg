<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" preserveAspectRatio="xMidYMid meet"><rect width="800" height="470" rx="10" fill="#FAFAFA"/><text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#141414">Camera Angles</text><text x="24" y="55" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8A8A8A">Where the lens sits is an argument about status</text><line x1="120" y1="362" x2="680" y2="362" stroke="#E2E2E2" stroke-width="1.5"/><g transform="translate(400,242) scale(1.15)"><g><line x1="-500" y1="100" x2="500" y2="100" stroke="#E2E2E2" stroke-width="1.2"/><circle cx="0" cy="7" r="7" fill="#141414"/><rect x="-2.5" y="12" width="5" height="5" fill="#141414"/><path d="M-12,17 L12,17 L10.5,55 L-10.5,55 Z" fill="#141414"/><line x1="-11" y1="21" x2="-16" y2="52" stroke="#141414" stroke-width="5" stroke-linecap="round"/><line x1="11" y1="21" x2="16" y2="52" stroke="#141414" stroke-width="5" stroke-linecap="round"/><line x1="-6" y1="54" x2="-7" y2="100" stroke="#141414" stroke-width="7.5" stroke-linecap="round"/><line x1="6" y1="54" x2="7" y2="100" stroke="#141414" stroke-width="7.5" stroke-linecap="round"/></g></g><line x1="400" y1="248" x2="400" y2="362" stroke="#E2E2E2" stroke-dasharray="3 4"/><g transform="translate(185,248) rotate(0)"><rect x="-13" y="-8" width="20" height="16" rx="2.5" fill="#2E2E2E"/><path d="M7,-5 L15,-9 L15,9 L7,5 Z" fill="#2E2E2E"/></g><text x="183" y="226" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="600" font-style="">Eye level — neutral, equal</text><g transform="translate(185,342) rotate(-26)"><rect x="-13" y="-8" width="20" height="16" rx="2.5" fill="#7A7A7A"/><path d="M7,-5 L15,-9 L15,9 L7,5 Z" fill="#7A7A7A"/></g><text x="183" y="376" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="600" font-style="">Low angle — power, threat</text><g transform="translate(185,158) rotate(24)"><rect x="-13" y="-8" width="20" height="16" rx="2.5" fill="#7A7A7A"/><path d="M7,-5 L15,-9 L15,9 L7,5 Z" fill="#7A7A7A"/></g><text x="183" y="128" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="600" font-style="">High angle — vulnerability</text><g transform="translate(408,104) rotate(90)"><rect x="-13" y="-8" width="20" height="16" rx="2.5" fill="#ABABAB"/><path d="M7,-5 L15,-9 L15,9 L7,5 Z" fill="#ABABAB"/></g><text x="434" y="90" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="600" font-style="">Overhead — fate, pattern, detachment</text><g transform="translate(618,248) rotate(180)"><rect x="-13" y="-8" width="20" height="16" rx="2.5" fill="#2E2E2E"/><path d="M7,-5 L15,-9 L15,9 L7,5 Z" fill="#2E2E2E"/></g><text x="638" y="226" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="end" font-weight="600" font-style="">Dutch angle (camera rolled) — unease</text><g transform="translate(618,248)"><line x1="-46" y1="26" x2="46" y2="12" stroke="#2E2E2E" stroke-width="1.5" stroke-dasharray="3 3"/></g><text x="24" y="430" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Camera height encodes power. The audience reads it instantly and never consciously notices.</text></svg>