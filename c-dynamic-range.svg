<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 392" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="392" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Dynamic Range</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Where the information lives</text><rect x="26" y="92" width="300" height="38" rx="5" fill="#141414"/><text x="40" y="116" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Clipped highlights</text><text x="344" y="109" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">no data at all — unrecoverable, permanently</text><text x="344" y="123" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">white</text><rect x="26" y="138" width="300" height="38" rx="5" fill="#232323"/><text x="40" y="162" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Highlight detail</text><text x="344" y="155" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">the first thing lost, and the thing to</text><text x="344" y="169" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">protect</text><rect x="26" y="184" width="300" height="38" rx="5" fill="#323232"/><text x="40" y="208" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Midtones</text><text x="344" y="201" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">skin lives here; expose for it</text><rect x="26" y="230" width="300" height="38" rx="5" fill="#414141"/><text x="40" y="254" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Shadow detail</text><text x="344" y="247" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">noisy but real; usually recoverable</text><rect x="26" y="276" width="300" height="38" rx="5" fill="#505050"/><text x="40" y="300" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Crushed blacks</text><text x="344" y="293" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">no data — acceptable if chosen</text><text x="22" y="376" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">The asymmetry is the practical point: highlights cannot be recovered, shadows usually can.</text></svg>