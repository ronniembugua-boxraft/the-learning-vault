.25" y="180" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">the audience stops</text><text x="253.25" y="195" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">tracking it</text><line x1="325.0" y1="127" x2="334.0" y2="127" stroke="#8A8A8A" stroke-width="1.4" marker-end="url(#a)"/><rect x="337.0" y="96" width="139.5" height="62" rx="6" fill="#141414"/><text x="347.0" y="116" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8f8f8f" text-anchor="start" font-weight="700" font-style="">03</text><text x="406.75" y="138" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600" font-style="">Return</text><text x="406.75" y="180" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">it reappears, changed</text><line x1="478.5" y1="127" x2="487.5" y2="127" stroke="#8A8A8A" stroke-width="1.4" marker-end="url(#a)"/><rect x="490.5" y="96" width="139.5" height="62" rx="6" fill="#141414"/><text x="500.5" y="116" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8f8f8f" text-anchor="start" font-weight="700" font-style="">04</text><text x="560.25" y="138" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600" font-style="">Payoff</text><text x="560.25" y="180" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">the earlier moment</text><text x="560.25" y="195" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">acquires meaning</text><tex