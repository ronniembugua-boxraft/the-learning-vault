<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 476" preserveAspectRatio="xMidYMid meet"><defs></defs><rect width="800" height="476" rx="10" fill="#FAFAFA"/><text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#141414">J-Cuts and L-Cuts</text><text x="24" y="55" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8A8A8A">Sound and picture do not have to cut together</text><text x="24" y="108" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#141414" text-anchor="start" font-weight="700" font-style="">Straight cut</text><text x="136" y="109" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="end" font-weight="600" font-style="">PICTURE</text><rect x="150" y="92" width="560" height="24" rx="3" fill="#fff" stroke="#E2E2E2"/><rect x="150" y="92" width="280.0" height="24" rx="3" fill="#141414" opacity="0.85"/><rect x="430.0" y="92" width="280.0" height="24" rx="3" fill="#7A7A7A" opacity="0.85"/><text x="136" y="139" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="end" font-weight="600" font-style="">AUDIO</text><rect x="150" y="122" width="560" height="24" rx="3" fill="#fff" stroke="#E2E2E2"/><rect x="150" y="122" width="280.0" height="24" rx="3" fill="#141414" opacity="0.85"/><rect x="430.0" y="122" width="280.0" height="24" rx="3" fill="#7A7A7A" opacity="0.85"/><line x1="430.0" y1="86" x2="430.0" y2="152" stroke="#2E2E2E" stroke-width="1.6" stroke-dasharray="3 3"/><text x="150" y="172" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Mechanical. Sound and image cut together — the join announces itself.</text><text x="24" y="226" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#141414" text-anchor="start" font-weight="700" font-style="">J-cut</text><text x="136" y="227" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="end" font-weight="600" font-style="">PICTURE</text><rect x="150" y="210" width="560" height="24" rx="3" fill="#fff" stroke="#E2E2E2"/><rect x="150" y="210" width="280.0" height="24" rx="3" fill="#141414" opacity="0.85"/><rect x="430.0" y="210" width="280.0" height="24" rx="3" fill="#7A7A7A" opacity="0.85"/><text x="136" y="257" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="end" font-weight="600" font-style="">AUDIO</text><rect x="150" y="240" width="560" height="24" rx="3" fill="#fff" stroke="#E2E2E2"/><rect x="150" y="240" width="212.8" height="24" rx="3" fill="#141414" opacity="0.85"/><rect x="362.8" y="240" width="347.2" height="24" rx="3" fill="#7A7A7A" opacity="0.85"/><line x1="430.0" y1="204" x2="430.0" y2="270" stroke="#2E2E2E" stroke-width="1.6" stroke-dasharray="3 3"/><line x1="362.8" y1="234" x2="362.8" y2="270" stroke="#ABABAB" stroke-width="1.6" stroke-dasharray="3 3"/><text x="150" y="290" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Next shot's AUDIO arrives first. We hear it, then see it.</text><text x="24" y="344" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#141414" text-anchor="start" font-weight="700" font-style="">L-cut</text><text x="136" y="345" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="end" font-weight="600" font-style="">PICTURE</text><rect x="150" y="328" width="560" height="24" rx="3" fill="#fff" stroke="#E2E2E2"/><rect x="150" y="328" width="280.0" height="24" rx="3" fill="#141414" opacity="0.85"/><rect x="430.0" y="328" width="280.0" height="24" rx="3" fill="#7A7A7A" opacity="0.85"/><text x="136" y="375" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="end" font-weight="600" font-style="">AUDIO</text><rect x="150" y="358" width="560" height="24" rx="3" fill="#fff" stroke="#E2E2E2"/><rect x="150" y="358" width="352.8" height="24" rx="3" fill="#141414" opacity="0.85"/><rect x="502.8" y="358" width="207.2" height="24" rx="3" fill="#7A7A7A" opacity="0.85"/><line x1="430.0" y1="322" x2="430.0" y2="388" stroke="#2E2E2E" stroke-width="1.6" stroke-dasharray="3 3"/><line x1="502.8" y1="352" x2="502.8" y2="388" stroke="#ABABAB" stroke-width="1.6" stroke-dasharray="3 3"/><text x="150" y="408" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Current shot's AUDIO continues over the new picture.</text><text x="24" y="452" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#2E2E2E" text-anchor="start" font-weight="400" font-style="italic">Highest-return fix on a rough edit: offset every audio transition a few frames from its picture cut.</text></svg>