<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 486" preserveAspectRatio="xMidYMid meet"><defs></defs><rect width="800" height="486" rx="10" fill="#FAFAFA"/><text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#141414">The Story Circle</text><text x="24" y="55" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8A8A8A">Harmon's eight beats — the most useful framework for short form</text><line x1="190" y1="268" x2="610" y2="268" stroke="#E2E2E2" stroke-dasharray="5 5"/><text x="186" y="260" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="end" font-weight="700" font-style="">ORDER</text><text x="186" y="284" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="end" font-weight="400" font-style="">known world</text><text x="614" y="260" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="start" font-weight="700" font-style="">CHAOS</text><text x="614" y="284" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">unknown</text><circle cx="400" cy="268" r="140" fill="none" stroke="#141414" stroke-width="1.6"/><circle cx="400.0" cy="128.0" r="9" fill="#141414"/><text x="400.0" y="90.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">1 You</text><text x="400.0" y="105.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">comfort zone</text><circle cx="498.99494936611666" cy="169.00505063388334" r="9" fill="#141414"/><text x="525.8650070512055" y="142.13499294879455" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#141414" text-anchor="start" font-weight="700" font-style="">2 Need</text><text x="525.8650070512055" y="157.13499294879455" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">wants something</text><circle cx="540.0" cy="268.0" r="9" fill="#141414"/><text x="578.0" y="268.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#141414" text-anchor="start" font-weight="700" font-style="">3 Go</text><text x="578.0" y="283.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">enters the unknown</text><circle cx="498.99494936611666" cy="366.99494936611666" r="9" fill="#141414"/><text x="525.8650070512055" y="393.86500705120545" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#141414" text-anchor="start" font-weight="700" font-style="">4 Search</text><text x="525.8650070512055" y="408.86500705120545" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">adapts</text><circle cx="400.0" cy="408.0" r="9" fill="#141414"/><text x="400.0" y="446.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">5 Find</text><text x="400.0" y="461.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">gets it</text><circle cx="301.00505063388334" cy="366.99494936611666" r="11" fill="#2E2E2E"/><text x="274.13499294879455" y="393.86500705120545" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#2E2E2E" text-anchor="end" font-weight="700" font-style="">6 Take</text><text x="274.13499294879455" y="408.86500705120545" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" 