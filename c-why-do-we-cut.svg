<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 438" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="438" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Why Do We Cut</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Murch's priority order when reasons conflict</text><rect x="26" y="92" width="300" height="38" rx="5" fill="#141414"/><text x="40" y="116" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Emotion</text><text x="344" y="109" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">does the cut serve what the audience should</text><text x="344" y="123" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">feel? ~51% of the decision</text><rect x="26" y="138" width="300" height="38" rx="5" fill="#202020"/><text x="40" y="162" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Story</text><text x="344" y="155" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">does it advance what the audience needs to</text><text x="344" y="169" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">know?</text><rect x="26" y="184" width="300" height="38" rx="5" fill="#2c2c2c"/><text x="40" y="208" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Rhythm</text><text x="344" y="201" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">does it land where the sequence wants it?</text><rect x="26" y="230" width="300" height="38" rx="5" fill="#383838"/><text x="40" y="254" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Eye-trace</text><text x="344" y="247" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">does the eye land in the right place across</text><text x="344" y="261" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">the join?</text><rect x="26" y="276" width="300" height="38" rx="5" fill="#444444"/><text x="40" y="300" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Screen plane</text><text x="344" y="293" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">is two-dimensional continuity respected?</text><rect x="26" y="322" width="300" height="38" rx="5" fill="#505050"/><text x="40" y="346" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Spatial continuity</text><text x="344" y="339" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">does the three-dimensional geography hold?</text><text x="22" y="422" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">When they conflict, protect emotion. 'The shot ran out' is not on this list.</text></svg>