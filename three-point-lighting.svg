<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" preserveAspectRatio="xMidYMid meet"><defs></defs><rect width="800" height="430" rx="10" fill="#FAFAFA"/><text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#141414">Three-Point Lighting</text><text x="24" y="55" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8A8A8A">The default setup — and the reason to leave it</text><circle cx="400" cy="230" r="26" fill="#141414"/><text x="400" y="282" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="700" font-style="">SUBJECT</text><g transform="translate(277.1271933566512,143.96353454734307)"><circle r="15" fill="#141414"/></g><line x1="277.1271933566512" y1="143.96353454734307" x2="378.7020468484862" y2="215.0870126548728" stroke="#141414" stroke-width="1.6" stroke-dasharray="4 3"/><text x="277.1271933566512" y="117.96353454734307" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#141414" text-anchor="middle" font-weight="700" font-style="">KEY</text><text x="277.1271933566512" y="133.96353454734307" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">45° off-axis. Shape and direction.</text><g transform="translate(522.8728066433488,143.96353454734304)"><circle r="15" fill="#7A7A7A"/></g><line x1="522.8728066433488" y1="143.96353454734304" x2="421.29795315151375" y2="215.08701265487278" stroke="#7A7A7A" stroke-width="1.6" stroke-dasharray="4 3"/><text x="522.8728066433488" y="117.96353454734304" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#7A7A7A" text-anchor="middle" font-weight="700" font-style="">FILL</text><text x="522.8728066433488" y="133.96353454734304" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">Opposite. Controls ratio, not mood.</text><g transform="translate(438.8228567653781,374.88887394336024)"><circle r="15" fill="#ABABAB"/></g><line x1="438.8228567653781" y1="374.88887394336024" x2="406.72929517266556" y2="255.11407148351577" stroke="#ABABAB" stroke-width="1.6" stroke-dasharray="4 3"/><text x="438.8228567653781" y="406.88887394336024" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#ABABAB" text-anchor="middle" font-weight="700" font-style="">BACK</text><text x="438.8228567653781" y="422.88887394336024" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">Separation from background.</text><g transform="translate(400,326)"><rect x="-16" y="-10" width="24" height="20" rx="2.5" fill="#8A8A8A"/><path d="M8,-6 L18,-11 L18,11 L8,6 Z" fill="#8A8A8A"/></g><text x="400" y="358" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="700" font-style="">CAMERA</text><text x="24" y="410" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">A starting point, not a style. Ask instead: what time is it, what is in this room, where is that light coming from?</text></svg>