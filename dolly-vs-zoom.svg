<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 432" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8A8A8A"/></marker></defs><rect width="800" height="432" rx="10" fill="#FAFAFA"/><text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#141414">Dolly In vs Zoom In</text><text x="24" y="55" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8A8A8A">Same framing. Completely different meaning.</text><text x="24" y="108" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" fill="#2E2E2E" text-anchor="start" font-weight="700" font-style="">DOLLY IN</text><text x="24" y="128" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Camera travels. Perspective changes, bac</text><text x="24" y="144" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">kground shifts. Feels like approaching.</text><rect x="300" y="90" width="150" height="104" rx="3" fill="#fff" stroke="#E2E2E2"/><rect x="322" y="128.0" width="34.0" height="26.0" fill="#8A8A8A" opacity="0.3"/><rect x="374.0" y="120.0" width="30.0" height="34.0" fill="#8A8A8A" opacity="0.22"/><circle cx="375" cy="152" r="13.0" fill="#141414"/><path d="M355.0,194 q20.0,-26.0 40.0,0 Z" fill="#141414"/><rect x="470" y="90" width="150" height="104" rx="3" fill="#fff" stroke="#E2E2E2"/><rect x="492" y="126.7" width="35.7" height="27.3" fill="#8A8A8A" opacity="0.3"/><rect x="542.5" y="118.3" width="31.5" height="35.7" fill="#8A8A8A" opacity="0.22"/><circle cx="545" cy="152" r="20.150000000000002" fill="#141414"/><path d="M514.0,194 q31.0,-40.300000000000004 62.0,0 Z" fill="#141414"/><line x1="456" y1="142" x2="464" y2="142" stroke="#2E2E2E" stroke-width="1.6" marker-end="url(#a)"/><text x="660" y="116" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">background</text><text x="660" y="132" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#2E2E2E" text-anchor="start" font-weight="600" font-style="">stays put</text><text x="660" y="154" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">→ depth reads</text><text x="24" y="268" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" fill="#7A7A7A" text-anchor="start" font-weight="700" font-style="">ZOOM IN</text><text x="24" y="288" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Lens magnifies from a fixed point. Persp</text><text x="24" y="304" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">ective identical. Feels like scrutinising.</text><rect x="300" y="250" width="150" height="104" rx="3" fill="#fff" stroke="#E2E2E2"/><rect x="322" y="288.0" width="34.0" height="26.0" fill="#8A8A8A" opacity="0.3"/><rect x="374.0" y="280.0" width="30.0" height="34.0" fill="#8A8A8A" opacity="0.22"/><circle cx="375" cy="312" r="13.0" fill="#141414"/><path d="M355.0,354 q20.0,-26.0 40.0,0 Z" fill="#141414"/><rect x="470" y="250" width="150" height="104" rx="3" fill="#fff" stroke="#E2E2E2"/><rect x="492" y="273.7" width="52.7" height="40.300000000000004" fill="#8A8A8A" opacity="0.3"/><rect x="527.5" y="261.3" width="46.5" height="52.7" fill="#8A8A8A" opacity="0.22"/><circle cx="545" cy="312" r="20.150000000000002" fill="#141414"/><path d="M514.0,354 q31.0,-40.300000000000004 62.0,0 Z" fill="#141414"/><line x1="456" y1="302" x2="464" y2="302" stroke="#7A7A7A" stroke-width="1.6" marker-end="url(#a)"/><text x="660" y="276" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">background</text><text x="660" y="292" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#7A7A7A" text-anchor="start" font-weight="600" font-style="">grows too</text><text x="660" y="314" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">→ space flattens</text><text x="24" y="410" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">No dolly? A very slow slider push beats a zoom every time. The parallax is the point, not the smoothness.</text></svg>