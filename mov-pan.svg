<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="640" height="300" rx="10" fill="#FAFAFA"/><text x="22" y="30" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Pan</text><text x="22" y="50" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Overhead view — camera pivots horizontally from a fixed point</text><circle cx="330" cy="165" r="13" fill="#141414"/><text x="330" y="197" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="700" font-style="">SUBJECT</text><g transform="translate(150,165) rotate(0) scale(1)"><rect x="-13" y="-9" width="20" height="18" rx="2.5" fill="#141414"/><path d="M7,-6 L16,-10 L16,10 L7,6 Z" fill="#141414"/></g><path d="M 172 113 A 60 60 0 0 1 172 217" fill="none" stroke="#2E2E2E" stroke-width="2" marker-end="url(#a)"/><text x="150" y="237" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">camera stays put</text><text x="240" y="103" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#2E2E2E" text-anchor="middle" font-weight="600" font-style="">lens sweeps</text><text x="22" y="282" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">We stay put and turn our head. Space is revealed, but our viewpoint never moves — no parallax.</text></svg>