<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="320" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Kill Your Favourite Shot</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">The test for a protected shot</text><rect x="26" y="86" width="286" height="180" rx="6" fill="#fff" stroke="#E2E2E2"/><rect x="26" y="86" width="286" height="34" rx="6" fill="#141414"/><rect x="26" y="108" width="286" height="12" fill="#141414"/><text x="40" y="108" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#fff" text-anchor="start" font-weight="700" font-style="">PROTECTED</text><text x="40" y="140" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="600" font-style="">kept for reasons outside the film</text><text x="40" y="162" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— It was hard to get</text><text x="40" y="183" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— It was expensive</text><text x="40" y="204" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— It is beautiful, and yours</text><rect x="334" y="86" width="286" height="180" rx="6" fill="#fff" stroke="#E2E2E2"/><rect x="334" y="86" width="286" height="34" rx="6" fill="#7A7A7A"/><rect x="334" y="108" width="286" height="12" fill="#7A7A7A"/><text x="348" y="108" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#fff" text-anchor="start" font-weight="700" font-style="">USED</text><text x="348" y="140" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="600" font-style="">kept because the film needs it</text><text x="348" y="162" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— Would you invent this sequence for</text><text x="357" y="177" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">it?</text><text x="348" y="198" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— If not, it is warping the structure</text><text x="348" y="219" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— Clients have favourites too</text><text x="22" y="304" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">A beautiful shot in the wrong place competes with the actual peak, and flattens it.</text></svg>