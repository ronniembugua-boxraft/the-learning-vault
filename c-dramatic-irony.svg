<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="320" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Dramatic Irony</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Who knows what, and when</text><rect x="26" y="86" width="286" height="180" rx="6" fill="#fff" stroke="#E2E2E2"/><rect x="26" y="86" width="286" height="34" rx="6" fill="#141414"/><rect x="26" y="108" width="286" height="12" fill="#141414"/><text x="40" y="108" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#fff" text-anchor="start" font-weight="700" font-style="">SURPRISE</text><text x="40" y="140" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="600" font-style="">audience learns with the character</text><text x="40" y="162" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— One second of shock</text><text x="40" y="183" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— No tension beforehand</text><text x="40" y="204" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— Hitchcock: the bomb simply explodes</text><rect x="334" y="86" width="286" height="180" rx="6" fill="#fff" stroke="#E2E2E2"/><rect x="334" y="86" width="286" height="34" rx="6" fill="#7A7A7A"/><rect x="334" y="108" width="286" height="12" fill="#7A7A7A"/><text x="348" y="108" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#fff" text-anchor="start" font-weight="700" font-style="">DRAMATIC IRONY</text><text x="348" y="140" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="600" font-style="">audience knows more</text><text x="348" y="162" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— Tension across the whole scene</text><text x="348" y="183" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— Every neutral line gains a second</text><text x="357" y="198" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">meaning</text><text x="348" y="219" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— Show the bomb, then let them talk</text><text x="22" y="304" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Giving the audience more information than the character converts watching into anticipation.</text></svg>