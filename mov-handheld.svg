<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="640" height="300" rx="10" fill="#FAFAFA"/><text x="22" y="30" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Handheld</text><text x="22" y="50" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Overhead view — camera held by the operator, unstabilised</text><path d="M 90 190 L 130 168 L 150 200 L 195 160 L 215 198 L 260 162 L 285 205 L 330 165 L 360 200 L 405 160 L 430 202 L 480 165 L 510 196 L 560 170" fill="none" stroke="#2E2E2E" stroke-width="2" marker-end="url(#a)"/><g transform="translate(90,190) rotate(0) scale(0.85)"><rect x="-13" y="-9" width="20" height="18" rx="2.5" fill="#7A7A7A"/><path d="M7,-6 L16,-10 L16,10 L7,6 Z" fill="#7A7A7A"/></g><text x="330" y="240" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">camera path</text><text x="22" y="282" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Introduces human instability. Reads as immediacy, urgency and documentary truth — or as anxiety.</text></svg>