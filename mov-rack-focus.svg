<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker><filter id="bl"><feGaussianBlur stdDeviation="3.2"/></filter></defs><rect width="640" height="300" rx="10" fill="#FAFAFA"/><text x="22" y="30" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Rack Focus</text><text x="22" y="50" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Focus shifts between subjects at different distances</text><g transform="translate(110,165) rotate(0) scale(1)"><rect x="-13" y="-9" width="20" height="18" rx="2.5" fill="#141414"/><path d="M7,-6 L16,-10 L16,10 L7,6 Z" fill="#141414"/></g><g filter="url(#bl)"><circle cx="280" cy="123" r="15" fill="#141414"/></g><text x="280" y="95" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">soft</text><circle cx="470" cy="195" r="15" fill="#141414"/><text x="470" y="225" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">sharp</text><path d="M 300 141 C 370 165, 400 175, 448 187" fill="none" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="375" y="127" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#2E2E2E" text-anchor="middle" font-weight="600" font-style="">focus travels</text><text x="22" y="282" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Moves the audience's attention without moving the camera or cutting. Directs the eye by force.</text></sv