<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 374" preserveAspectRatio="xMidYMid meet"><defs></defs><rect width="800" height="374" rx="10" fill="#FAFAFA"/><text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#141414">Focal Length Psychology</text><text x="24" y="55" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8A8A8A">Wide includes and exposes. Long isolates and observes.</text><rect x="48" y="92" width="336" height="190" rx="4" fill="#fff" stroke="#E2E2E2"/><rect x="106.344" y="208.72" width="23.312" height="33.28" fill="#8A8A8A" opacity="0.22"/><rect x="186.344" y="202.32" width="23.312" height="39.68" fill="#8A8A8A" opacity="0.33999999999999997"/><rect x="276.344" y="211.92000000000002" width="23.312" height="30.08" fill="#8A8A8A" opacity="0.45999999999999996"/><line x1="56" y1="242" x2="376" y2="242" stroke="#E2E2E2"/><circle cx="216" cy="200" r="24" fill="#141414"/><path d="M188,272 q28,-46 56,0 Z" fill="#141414"/><text x="56" y="84" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" fill="#2E2E2E" text-anchor="start" font-weight="700" font-style="">WIDE — 24mm</text><text x="48" y="302" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Background small and far. Space opens up. Su</text><text x="48" y="318" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">bject exposed in a large world.</text><rect x="424" y="92" width="336" height="190" rx="4" fill="#fff" stroke="#E2E2E2"/><rect x="468.2" y="172.0" width="51.6" height="70.0" fill="#8A8A8A" opacity="0.22"/><rect x="548.2" y="152.0" width="51.6" height="90.0" fill="#8A8A8A" opacity="0.33999999999999997"/><rect x="638.2" y="182.0" width="51.6" height="60.0" fill="#8A8A8A" opacity="0.45999999999999996"/><line x1="432" y1="242" x2="752" y2="242" stroke="#E2E2E2"/><circle cx="592" cy="200" r="24" fill="#141414"/><path d="M564,272 q28,-46 56,0 Z" fill="#141414"/><text x="432" y="84" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13.5" fill="#7A7A7A" text-anchor="start" font-weight="700" font-style="">LONG — 135mm</text><text x="424" y="302" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Background magnified and pressed forward. Sp</text><text x="424" y="318" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">ace flattens. Subject isolated.</text><text x="24" y="352" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Same subject size in frame. Opposite emotional statement. Focal length changes the relationship between planes, not just field of view.</text></svg>