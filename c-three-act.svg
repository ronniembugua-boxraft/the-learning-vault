t-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">What defines an act break is irreversibility — afterwards, the previous strategy no longer works.</text></svg>