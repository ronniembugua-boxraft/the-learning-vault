<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="250" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Frame Rate and Motion</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">How motion renders</text><line x1="60" y1="150" x2="600" y2="150" stroke="#141414" stroke-width="2"/><text x="60" y="196" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="600" font-style="">blurred</text><text x="600" y="196" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="end" font-weight="600" font-style="">crisp</text><line x1="114.0" y1="141" x2="114.0" y2="159" stroke="#141414" stroke-width="2"/><circle cx="114.0" cy="150" r="4.5" fill="#2E2E2E"/><text x="114.0" y="126" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">24fps / 180°</text><text x="114.0" y="176" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">the motion blur read</text><text x="114.0" y="189" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">as 'film'</text><line x1="303.0" y1="141" x2="303.0" y2="159" stroke="#141414" stroke-width="2"/><circle cx="303.0" cy="150" r="4.5" fill="#2E2E2E"/><text x="303.0" y="112" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">24fps / narrow</text><text x="303.0" y="126" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">shutter</text><text x="303.0" y="176" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">crisp, staccato,</text><text x="303.0" y="189" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">urgent</text><line x1="492.0" y1="141" x2="492.0" y2="159" stroke="#141414" stroke-width="2"/><circle cx="492.0" cy="150" r="4.5" fill="#2E2E2E"/><text x="492.0" y="126" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">48–60fps playback</text><text x="492.0" y="176" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">no blur — reads as</text><text x="492.0" y="189" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">live, or as cheap</text><text x="22" y="234" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Slow motion is an emphasis device. Applied everywhere, it emphasises nothing.</text></svg>