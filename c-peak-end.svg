<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="300" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">The Peak-End Rule</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">What is remembered versus what was experienced</text><line x1="70" y1="222" x2="606" y2="222" stroke="#E2E2E2"/><line x1="70" y1="96" x2="70" y2="222" stroke="#E2E2E2"/><text x="60" y="102" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="end" font-weight="400" font-style="">intensity</text><text x="60" y="226" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="end" font-weight="400" font-style="">flat</text><path d="M 70.0 190.5 L 134.3 184.2 L 204.0 165.3 L 273.7 177.9 L 338.0 171.6 L 402.3 106.1 L 455.9 159.0 L 525.6 166.6 L 606.0 121.2" fill="none" stroke="#2E2E2E" stroke-width="2.4"/><line x1="402.32" y1="222" x2="402.32" y2="232" stroke="#8A8A8A"/><text x="402.32" y="248" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">the peak</text><line x1="606" y1="222" x2="606" y2="232" stroke="#8A8A8A"/><text x="606" y="248" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">the end</text><text x="22" y="284" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Trim w