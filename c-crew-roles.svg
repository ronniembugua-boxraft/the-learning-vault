<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 438" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="438" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Crew Roles and Who Does What</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Who to ask, and whose job not to do</text><rect x="26" y="92" width="300" height="38" rx="5" fill="#141414"/><text x="40" y="116" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">1st AD</text><text x="344" y="109" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">runs the floor and the clock — your closest</text><text x="344" y="123" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">ally</text><rect x="26" y="138" width="300" height="38" rx="5" fill="#202020"/><text x="40" y="162" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">DP</text><text x="344" y="155" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">owns the image; gaffer executes the light</text><rect x="26" y="184" width="300" height="38" rx="5" fill="#2c2c2c"/><text x="40" y="208" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">1st AC</text><text x="344" y="201" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">owns focus</text><rect x="26" y="230" width="300" height="38" rx="5" fill="#383838"/><text x="40" y="254" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Sound recordist</text><text x="344" y="247" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">owns audio — the first role cut, the one</text><text x="344" y="261" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">most missed</text><rect x="26" y="276" width="300" height="38" rx="5" fill="#444444"/><text x="40" y="300" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Script supervisor</text><text x="344" y="293" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">owns continuity and notes to editorial</text><rect x="26" y="322" width="300" height="38" rx="5" fill="#505050"/><text x="40" y="346" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Producer</text><text x="344" y="339" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">owns money and logistics</text><text x="22" y="422" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">On small crews these collapse into two or three people — but someone is still doing each, often you, by accident.</text></svg>