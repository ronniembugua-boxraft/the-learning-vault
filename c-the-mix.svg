<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 346" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="346" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">The Mix</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">What the audience hears at any moment</text><rect x="26" y="92" width="300" height="38" rx="5" fill="#141414"/><text x="40" y="116" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Dialogue</text><text x="344" y="109" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">always intelligible — when they conflict,</text><text x="344" y="123" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">this wins</text><rect x="26" y="138" width="300" height="38" rx="5" fill="#282828"/><text x="40" y="162" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Effects and foley</text><text x="344" y="155" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">presence, physicality, place</text><rect x="26" y="184" width="300" height="38" rx="5" fill="#3c3c3c"/><text x="40" y="208" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Ambience / room tone</text><text x="344" y="201" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">the continuous floor beneath everything</text><rect x="26" y="230" width="300" height="38" rx="5" fill="#505050"/><text x="40" y="254" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Music</text><text x="344" y="247" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">supporting, ducking under lines, opening in</text><text x="344" y="261" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">gaps</text><text x="22" y="330" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">A static mix with music at a fixed level is the signature of a film that was never mixed.</text></svg>