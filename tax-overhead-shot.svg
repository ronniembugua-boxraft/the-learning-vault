<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="640" height="320" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Overhead Shot</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Camera directly above, looking straight down</text><line x1="80" y1="250" x2="560" y2="250" stroke="#E2E2E2"/><ellipse cx="320" cy="250" rx="30" ry="12" fill="#141414"/><text x="320" y="278" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="700" font-style="">SUBJECT (from above)</text><g transform="translate(320,110) rotate(90) scale(1)"><rect x="-13" y="-9" width="20" height="18" rx="2.5" fill="#2E2E2E"/><path d="M7,-6 L16,-10 L16,10 L7,6 Z" fill="#2E2E2E"/></g><text x="320" y="92" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#2E2E2E" text-anchor="middle" font-weight="600" font-style="">camera directly above</text><line x1="320" y1="132" x2="320" y2="230" stroke="#2E2E2E" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="22" y="304" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Detachment and pattern. People become figures in a design — fate, surveillance, insignificance.</text></svg>