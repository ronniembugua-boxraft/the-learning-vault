<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="640" height="300" rx="10" fill="#FAFAFA"/><text x="22" y="30" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Tracking Shot</text><text x="22" y="50" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Overhead view — sustained follow through space</text><path d="M 110 235 C 210 235, 250 120, 350 120 S 500 210, 560 200" fill="none" stroke="#E2E2E2" stroke-width="10" stroke-linecap="round"/><path d="M 110 235 C 210 235, 250 120, 350 120 S 500 210, 560 200" fill="none" stroke="#2E2E2E" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><circle cx="200" cy="196" r="13" fill="#141414"/><circle cx="350" cy="120" r="13" fill="#141414"/><circle cx="480" cy="168" r="13" fill="#141414"/><g transform="translate(150,235) rotate(-20) scale(0.85)"><rect x="-13" y="-9" width="20" height="18" rx="2.5" fill="#2E2E2E"/><path d="M7,-6 L16,-10 L16,10 L7,6 Z" fill="#2E2E2E"/></g><text x="330" y="90" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#2E2E2E" text-anchor="middle" font-weight="600" font-style="">camera follows the subject through space</text><text x="22" y="282" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Binds us to a character. The length itself becomes meaning — we cannot look away or cut away.</text></svg>