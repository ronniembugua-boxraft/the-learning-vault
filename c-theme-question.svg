<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="320" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Theme as a Question, Not a Message</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">How theme is held</text><rect x="26" y="86" width="286" height="180" rx="6" fill="#fff" stroke="#E2E2E2"/><rect x="26" y="86" width="286" height="34" rx="6" fill="#141414"/><rect x="26" y="108" width="286" height="12" fill="#141414"/><text x="40" y="108" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#fff" text-anchor="start" font-weight="700" font-style="">MESSAGE</text><text x="40" y="140" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="600" font-style="">'family matters'</text><text x="40" y="162" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— Closes; the film becomes an argument</text><text x="40" y="183" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— Audiences argue back</text><text x="40" y="204" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— Approvable, measurable, inert</text><rect x="334" y="86" width="286" height="180" rx="6" fill="#fff" stroke="#E2E2E2"/><rect x="334" y="86" width="286" height="34" rx="6" fill="#7A7A7A"/><rect x="334" y="108" width="286" height="12" fill="#7A7A7A"/><text x="348" y="108" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#fff" text-anchor="start" font-weight="700" font-style="">QUESTION</text><text x="348" y="140" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="600" font-style="">'what does loyalty cost?'</text><text x="348" y="162" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— Opens; the film explores</text><text x="348" y="183" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— The audience arrives at the answer</text><text x="348" y="204" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="400" font-style="">— Never asked aloud</text><text x="22" y="304" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">If the room nods comfortably it is a message. If they want to discuss it, it is a question.</text></svg>