<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="r1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F4F4F4"/><stop offset="46%" stop-color="#F4F4F4"/><stop offset="46%" stop-color="#DEDEDE"/><stop offset="100%" stop-color="#DEDEDE"/></linearGradient><linearGradient id="r2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F4F4F4"/><stop offset="50%" stop-color="#F4F4F4"/><stop offset="50%" stop-color="#9A9A9A"/><stop offset="100%" stop-color="#9A9A9A"/></linearGradient><linearGradient id="r3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F4F4F4"/><stop offset="54%" stop-color="#F4F4F4"/><stop offset="54%" stop-color="#2A2A2A"/><stop offset="100%" stop-color="#2A2A2A"/></linearGradient></defs><rect width="800" height="384" rx="10" fill="#FAFAFA"/><text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#141414">Lighting Ratio</text><text x="24" y="55" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8A8A8A">Contrast is emotional temperature, made measurable</text><circle cx="140" cy="180" r="62" fill="url(#r1)" stroke="#E2E2E2"/><line x1="140" y1="118" x2="140" y2="242" stroke="#E2E2E2" stroke-dasharray="3 3"/><text x="140" y="268" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" fill="#141414" text-anchor="middle" font-weight="700" font-style="">1:1</text><text x="140" y="288" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#2E2E2E" text-anchor="middle" font-weight="600" font-style="">Flat</text><text x="140" y="312" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">Open, safe, honest. Reads as unthr</text><text x="140" y="328" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">eatening — and slightly bland.</text><circle cx="386" cy="180" r="62" fill="url(#r2)" stroke="#E2E2E2"/><line x1="386" y1="118" x2="386" y2="242" stroke="#E2E2E2" stroke-dasharray="3 3"/><text x="386" y="268" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" fill="#141414" text-anchor="middle" font-weight="700" font-style="">4:1</text><text x="386" y="288" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#2E2E2E" text-anchor="middle" font-weight="600" font-style="">Shaped</text><text x="386" y="312" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">Dimensional and considered. Most n</text><text x="386" y="328" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">arrative sits here.</text><circle cx="632" cy="180" r="62" fill="url(#r3)" stroke="#E2E2E2"/><line x1="632" y1="118" x2="632" y2="242" stroke="#E2E2E2" stroke-dasharray="3 3"/><text x="632" y="268" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" fill="#141414" text-anchor="middle" font-weight="700" font-style="">16:1</text><text x="632" y="288" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#2E2E2E" text-anchor="middle" font-weight="600" font-style="">Severe</text><text x="632" y="312" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">Withholding, tense, concealing. Ha</text><text x="632" y="328" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">lf the face is gone.</text><text x="24" y="364" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Ratio is characterisation. Three interviewees playing different roles should not be lit identically.</text></svg>