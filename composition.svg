<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8A8A8A"/></marker></defs><rect width="800" height="340" rx="10" fill="#FAFAFA"/><text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#141414">Composition Fundamentals</text><text x="24" y="55" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8A8A8A">Where to put things, and why</text><rect x="60" y="90" width="320" height="180" rx="3" fill="#fff" stroke="#E2E2E2"/><line x1="166.66666666666669" y1="90" x2="166.66666666666669" y2="270" stroke="#E2E2E2"/><line x1="60" y1="150.0" x2="380" y2="150.0" stroke="#E2E2E2"/><line x1="273.33333333333337" y1="90" x2="273.33333333333337" y2="270" stroke="#E2E2E2"/><line x1="60" y1="210.0" x2="380" y2="210.0" stroke="#E2E2E2"/><circle cx="166.66666666666669" cy="150.0" r="7" fill="#2E2E2E"/><circle cx="166.66666666666669" cy="184.0" r="20" fill="#141414"/><path d="M136.66666666666669,270 q30,-46 60,0 Z" fill="#141414"/><text x="60" y="80" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#141414" text-anchor="start" font-weight="600" font-style="">Rule of thirds — subject on an intersection</text><text x="60" y="292" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Balance with tension. Its real value: once it is your default,</text><text x="60" y="308" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">breaking it becomes meaningful.</text><rect x="440" y="90" width="320" height="180" rx="3" fill="#fff" stroke="#E2E2E2"/><circle cx="548" cy="186" r="22" fill="#141414"/><path d="M512,270 q36,-52 72,0 Z" fill="#141414"/><line x1="548" y1="90" x2="548" y2="162" stroke="#7A7A7A" stroke-width="1.4" stroke-dasharray="3 3"/><text x="554" y="130" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#7A7A7A" text-anchor="start" font-weight="600" font-style="">headroom</text><line x1="574" y1="186" x2="752" y2="186" stroke="#2E2E2E" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#a)"/><text x="590" y="178" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#2E2E2E" text-anchor="start" font-weight="600" font-style="">looking room</text><text x="440" y="80" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#141414" text-anchor="start" font-weight="600" font-style="">Headroom and looking room</text><text x="440" y="292" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Too little feels cramped and tense. Too much feels adrift.</text><text x="440" y="308" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Space goes where the subject is looking.</text></svg>