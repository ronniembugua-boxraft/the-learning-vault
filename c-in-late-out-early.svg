t><text x="330.0" y="126" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">transaction</text><text x="330.0" y="176" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">start here</text><line x1="524.4" y1="141" x2="524.4" y2="159" stroke="#141414" stroke-width="2"/><circle cx="524.4" cy="150" r="4.5" fill="#2E2E2E"/><text x="524.4" y="112" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">aftermath,</text><text x="524.4" y="126" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">discussion</text><text x="524.4" y="176" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">leave before this</text><text x="22" y="234" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">The audience reconstructs the missing parts effortlessly. Making them do it is what feels brisk and intelligent.</text></svg>