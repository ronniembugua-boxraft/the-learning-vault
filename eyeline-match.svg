<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="680" height="300" rx="10" fill="#FAFAFA"/><text x="22" y="30" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Eyeline Match</text><text x="22" y="50" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Where a character looks, the next shot delivers</text><rect x="170" y="90" width="220" height="124" rx="3" fill="#fff" stroke="#E2E2E2"/><text x="170" y="80" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="600" font-style="">Shot 1 — she looks screen-right</text><rect x="400" y="90" width="220" height="124" rx="3" fill="#fff" stroke="#E2E2E2"/><text x="400" y="80" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="600" font-style="">Shot 2 — delivers what she saw</text><circle cx="245" cy="150" r="26" fill="#141414"/><circle cx="258" cy="144" r="4" fill="#fff"/><line x1="272" y1="146" x2="368" y2="140" stroke="#2E2E2E" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a)"/><text x="320" y="128" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#2E2E2E" text-anchor="middle" font-weight="600" font-style="">eyeline</text><rect x="470" y="118" width="70" height="66" fill="#ABABAB" opacity="0.4"/><text x="505" y="200" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">what she is looking at</text><text x="22" y="252" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">The audience stitches the two into one continuous space without noticing they are doing it.</text><text x="22" y="282" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Get it wrong and the space quietly stops making sense — viewers feel it without being able to name it.</text></svg>