<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="250" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">The Single-Minded Proposition</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">How many things the film says</text><line x1="60" y1="150" x2="600" y2="150" stroke="#141414" stroke-width="2"/><text x="60" y="196" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="600" font-style="">single</text><text x="600" y="196" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="end" font-weight="600" font-style="">committee</text><line x1="103.2" y1="141" x2="103.2" y2="159" stroke="#141414" stroke-width="2"/><circle cx="103.2" cy="150" r="4.5" fill="#2E2E2E"/><text x="103.2" y="126" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">one thing</text><text x="103.2" y="176" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">remembered</text><line x1="330.0" y1="141" x2="330.0" y2="159" stroke="#141414" stroke-width="2"/><circle cx="330.0" cy="150" r="4.5" fill="#2E2E2E"/><text x="330.0" y="126" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">two or three</text><text x="330.0" y="176" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">diluted</text><line x1="556.8" y1="141" x2="556.8" y2="159" stroke="#141414" stroke-width="2"/><circle cx="556.8" cy="150" r="4.5" fill="#2E2E2E"/><text x="556.8" y="112" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">everything</text><text x="556.8" y="126" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">approved</text><text x="556.8" y="176" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">remembered by nobody</text><text x="22" y="234" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">If the sentence contains 'and', it is not single-minded. Name it early — approval processes only ever add.</text></svg>