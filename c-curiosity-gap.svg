<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="250" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Curiosity Gap</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">How wide to open the question</text><line x1="60" y1="150" x2="600" y2="150" stroke="#141414" stroke-width="2"/><text x="60" y="196" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="600" font-style="">no question</text><text x="600" y="196" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="end" font-weight="600" font-style="">unanswerable</text><line x1="87.0" y1="141" x2="87.0" y2="159" stroke="#141414" stroke-width="2"/><circle cx="87.0" cy="150" r="4.5" fill="#2E2E2E"/><text x="87.0" y="126" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">closed</text><text x="87.0" y="176" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">answered up front —</text><text x="87.0" y="189" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">nothing owed</text><line x1="330.0" y1="141" x2="330.0" y2="159" stroke="#141414" stroke-width="2"/><circle cx="330.0" cy="150" r="4.5" fill="#2E2E2E"/><text x="330.0" y="112" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">open and</text><text x="330.0" y="126" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">answerable</text><text x="330.0" y="176" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">attention is held</text><line x1="573.0" y1="141" x2="573.0" y2="159" stroke="#141414" stroke-width="2"/><circle cx="573.0" cy="150" r="4.5" fill="#2E2E2E"/><text x="573.0" y="126" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">too wide</text><text x="573.0" y="176" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">reads as vague;</text><text x="573.0" y="189" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">audience disengages</text><text x="22" y="234" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">The gap must also attach to something the viewer already cares about. Curiosity is never generic.</text></svg>