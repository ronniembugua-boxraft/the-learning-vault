<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="340" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Positioning and Specialism</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">The loop, and where to intervene</text><path d="M 341.7 112.8 A 84 84 0 0 1 413.2 184.3" fill="none" stroke="#2E2E2E" stroke-width="2" marker-end="url(#a)"/><text x="417.6812408671319" y="108.31875913286811" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="600" font-style="">The work you accept</text><path d="M 413.2 207.7 A 84 84 0 0 1 341.7 279.2" fill="none" stroke="#2E2E2E" stroke-width="2" marker-end="url(#a)"/><text x="417.6812408671319" y="283.6812408671319" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="600" font-style="">becomes your reel</text><path d="M 318.3 279.2 A 84 84 0 0 1 246.8 207.7" fill="none" stroke="#2E2E2E" stroke-width="2" marker-end="url(#a)"/><text x="242.3187591328681" y="283.6812408671319" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="end" font-weight="600" font-style="">which shapes your</text><text x="242.3187591328681" y="297.6812408671319" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="end" font-weight="600" font-style="">enquiries</text><path d="M 246.8 184.3 A 84 84 0 0 1 318.3 112.8" fill="none" stroke="#2E2E2E" stroke-width="2" marker-end="url(#a)"/><text x="242.31875913286808" y="108.31875913286811" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="end" font-weight="600" font-style="">which decides the</text><text x="242.31875913286808" y="122.31875913286811" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="end" font-weight="600" font-style="">work you're offered</text><text x="22" y="324" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">The only intervention point is which projects you accept — which means occasionally declining work that blurs it.</text></svg>