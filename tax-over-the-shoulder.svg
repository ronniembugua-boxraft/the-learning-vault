<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="640" height="320" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Over-the-Shoulder</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Framed past one person's shoulder onto another</text><rect x="70" y="86" width="250" height="150" rx="3" fill="#fff" stroke="#E2E2E2"/><path d="M 78 236 q 44 -84 96 -84 q 30 0 44 30 L 118 236 Z" fill="#141414" opacity="0.9"/><circle cx="116" cy="128" r="24" fill="#141414" opacity="0.9"/><text x="112" y="254" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">near figure (out of focus)</text><circle cx="248" cy="146" r="22" fill="#141414"/><path d="M 218 236 q 30 -48 60 0 Z" fill="#141414"/><text x="248" y="118" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">subject</text><g transform="translate(430,190) rotate(-155) scale(1)"><rect x="-13" y="-9" width="20" height="18" rx="2.5" fill="#2E2E2E"/><path d="M7,-6 L16,-10 L16,10 L7,6 Z" fill="#2E2E2E"/></g><text x="452" y="196" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#2E2E2E" text-anchor="start" font-weight="600" font-style="">camera past the shoulder</text><line x1="414" y1="182" x2="300" y2="156" stroke="#2E2E2E" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/><text x="22" y="304" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Establishes relationship and aligns us with the near figure. The geometry of a conversation.</text></svg>