<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="640" height="320" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Dutch Angle</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Camera rolled so the horizon is no longer level</text><rect x="70" y="88" width="230" height="140" rx="3" fill="#fff" stroke="#E2E2E2"/><g transform="translate(185,158) rotate(-14)"><line x1="-100" y1="34" x2="100" y2="34" stroke="#8A8A8A" stroke-width="1.5"/><circle cx="0" cy="0" r="20" fill="#141414"/><path d="M-30,34 q30,-44 60,0 Z" fill="#141414"/></g><text x="185" y="246" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">horizon tilts</text><g transform="translate(430,158) rotate(-14) scale(1)"><rect x="-13" y="-9" width="20" height="18" rx="2.5" fill="#2E2E2E"/><path d="M7,-6 L16,-10 L16,10 L7,6 Z" fill="#2E2E2E"/></g><text x="430" y="200" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#2E2E2E" text-anchor="middle" font-weight="600" font-style="">camera rolled</text><path d="M 470 130 A 46 46 0 0 0 470 186" fill="none" stroke="#2E2E2E" stroke-width="1.6" stroke-dasharray="4 3"/><text x="22" y="304" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Signals wrongness — instability, disorientation. Extremely legible, and therefore easily overused.</text></svg>