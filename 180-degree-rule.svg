<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" preserveAspectRatio="xMidYMid meet"><rect width="800" height="470" rx="10" fill="#FAFAFA"/><text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#141414">The 180-Degree Rule</text><text x="24" y="55" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8A8A8A">Screen direction, and why breaking it disorients</text><path d="M 150 250 A 250 250 0 0 1 650 250 Z" fill="#EDEDED" opacity="0.75"/><path d="M 150 250 A 250 250 0 0 0 650 250 Z" fill="#DCDCDC" opacity="0.65"/><line x1="120" y1="250" x2="680" y2="250" stroke="#141414" stroke-width="2" stroke-dasharray="7 5"/><text x="126" y="242" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="700" font-style="">THE LINE</text><circle cx="290" cy="250" r="17" fill="#141414"/><text x="290" y="255" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" font-style="">A</text><circle cx="510" cy="250" r="17" fill="#141414"/><text x="510" y="255" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" font-style="">B</text><line x1="308" y1="250" x2="492" y2="250" stroke="#8A8A8A" stroke-width="1.2"/><g transform="translate(222.4647922241901,147.49999999999997) rotate(30)"><rect x="-13" y="-8" width="20" height="16" rx="2.5" fill="#7A7A7A"/><path d="M7,-5 L15,-9 L15,9 L7,5 Z" fill="#7A7A7A"/></g><text x="222.4647922241901" y="147.49999999999997" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="600" font-style=""></text><g transform="translate(282.4168305480355,82.07383092075673) rotate(55)"><rect x="-13" y="-8" width="20" height="16" rx="2.5" fill="#7A7A7A"/><path d="M7,-5 L15,-9 L15,9 L7,5 Z" fill="#7A7A7A"/></g><text x="282.4168305480355" y="82.07383092075673" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="600" font-style=""></text><g transform="translate(371.4695143031865,46.995045907978096) rotate(82)"><rect x="-13" y="-8" width="20" height="16" rx="2.5" fill="#7A7A7A"/><path d="M7,-5 L15,-9 L15,9 L7,5 Z" fill="#7A7A7A"/></g><text x="371.4695143031865" y="46.995045907978096" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="600" font-style=""></text><g transform="translate(470.11412938176215,57.363012738888784) rotate(110)"><rect x="-13" y="-8" width="20" height="16" rx="2.5" fill="#7A7A7A"/><path d="M7,-5 L15,-9 L15,9 L7,5 Z" fill="#7A7A7A"/></g><text x="470.11412938176215" y="57.363012738888784" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="600" font-style=""></text><g transform="translate(552.3446892228658,112.82822569643409) rotate(138)"><rect x="-13" y="-8" width="20" height="16" rx="2.5" fill="#7A7A7A"/><path d="M7,-5 L15,-9 L15,9 L7,5 Z" fill="#7A7A7A"/></g><text x="552.3446892228658" y="112.82822569643409" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="600" font-style=""></text><g transform="translate(592.6369872611112,179.88587061823793) rotate(160)"><rect x="-13" y="-8" width="20" height="16" rx="2.5" fill="#7A7A7A"/><path d="M7,-5 L15,-9 L15,9 L7,5 Z" fill="#7A7A7A"/></g><text x="592.6369872611112" y="179.88587061823793" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="600" font-style=""></text><text x="400" y="120" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#7A7A7A" text-anchor="middle" font-weight="700" font-style="">SHOOT FROM THIS SIDE ONLY</text><text x=