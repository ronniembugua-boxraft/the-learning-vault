<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 392" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="660" height="392" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Budgeting Fundamentals</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Where the money sits</text><rect x="26" y="92" width="300" height="38" rx="5" fill="#141414"/><text x="40" y="116" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Above the line</text><text x="344" y="109" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">director, writer, key talent — the creative</text><rect x="26" y="138" width="300" height="38" rx="5" fill="#232323"/><text x="40" y="162" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Below the line</text><text x="344" y="155" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">crew, kit, locations, travel, catering</text><rect x="26" y="184" width="300" height="38" rx="5" fill="#323232"/><text x="40" y="208" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Post</text><text x="344" y="201" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">edit, grade, mix, music, VFX — budget this</text><text x="344" y="215" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">first</text><rect x="26" y="230" width="300" height="38" rx="5" fill="#414141"/><text x="40" y="254" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Insurance</text><text x="344" y="247" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">public liability, equipment, employer's</text><rect x="26" y="276" width="300" height="38" rx="5" fill="#505050"/><text x="40" y="300" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#fff" text-anchor="start" font-weight="600" font-style="">Contingency</text><text x="344" y="293" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">~10%, and it is not padding</text><text x="22" y="376" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Contingency is the money that lets you solve a problem without asking permission.</text></svg>