<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="680" height="300" rx="10" fill="#FAFAFA"/><text x="22" y="30" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Continuity</text><text x="22" y="50" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Consistency of props, position and performance across cuts</text><rect x="80" y="92" width="120" height="110" rx="3" fill="#fff" stroke="#E2E2E2" stroke-width="1"/><text x="80" y="84" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="600" font-style="">Shot 1</text><circle cx="125" cy="150" r="20" fill="#141414"/><rect x="163" y="168" width="18" height="22" fill="#ABABAB"/><text x="172" y="206" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">glass</text><rect x="310" y="92" width="120" height="110" rx="3" fill="#fff" stroke="#E2E2E2" stroke-width="1"/><text x="310" y="84" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#141414" text-anchor="start" font-weight="600" font-style="">Shot 2 — matches</text><circle cx="355" cy="150" r="20" fill="#141414"/><rect x="393" y="168" width="18" height="22" fill="#ABABAB"/><text x="402" y="206" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">glass</text><rect x="540" y="92" width="120" height="110" rx="3" fill="#fff" stroke="#2E2E2E" stroke-width="2"/><text x="540" y="84" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#2E2E2E" text-anchor="start" font-weight="600" font-style="">Shot 3 — breaks</text><circle cx="585" cy="150" r="20" fill="#141414"/><rect x="549" y="168" width="18" height="10" fill="#ABABAB"/><text x="558" y="206" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">glass</text><line x1="620" y1="118" x2="656" y2="154" stroke="#2E2E2E" stroke-width="2.5"/><line x1="656" y1="118" x2="620" y2="154" stroke="#2E2E2E" stroke-width="2.5"/><text x="22" y="246" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Audiences rarely spot the error consciously. They just feel the scene become slightly untrustworthy.</text><text x="22" y="282" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Emotional continuity outranks physical continuity — a performance mismatch hurts far more than a moved glass.</text></svg>