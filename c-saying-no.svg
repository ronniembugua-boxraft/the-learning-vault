<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="640" height="286" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Saying No Without Losing the Room</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">A refusal that is a service</text><rect x="30.0" y="96" width="184.0" height="62" rx="6" fill="#141414"/><text x="40.0" y="116" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8f8f8f" text-anchor="start" font-weight="700" font-style="">01</text><text x="122.0" y="138" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600" font-style="">Acknowledge</text><text x="122.0" y="180" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">the concern is</text><text x="122.0" y="195" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">legitimate</text><line x1="216.0" y1="127" x2="225.0" y2="127" stroke="#8A8A8A" stroke-width="1.4" marker-end="url(#a)"/><rect x="228.0" y="96" width="184.0" height="62" rx="6" fill="#141414"/><text x="238.0" y="116" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8f8f8f" text-anchor="start" font-weight="700" font-style="">02</text><text x="320.0" y="138" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600" font-style="">Explain the cost</text><text x="320.0" y="180" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">in terms of their goal,</text><text x="320.0" y="195" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">not your taste</text><line x1="414.0" y1="127" x2="423.0" y2="127" stroke="#8A8A8A" stroke-width="1.4" marker-end="url(#a)"/><rect x="426.0" y="96" width="184.0" height="62" rx="6" fill="#141414"/><text x="436.0" y="116" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8f8f8f" text-anchor="start" font-weight="700" font-style="">03</text><text x="518.0" y="132" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600" font-style="">Offer an</text><text x="518.0" y="146" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600" font-style="">alternative</text><text x="518.0" y="180" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">addressing the same</text><text x="518.0" y="195" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">worry differently</text><text x="22" y="270" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Never refuse on taste — 'I don't like it' is unarguable and reads as ego. Concede on small things to earn the big one.</text></svg>