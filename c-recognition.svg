<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="640" height="380" rx="10" fill="#FAFAFA"/><text x="22" y="32" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Recognition Beats Aspiration</text><text x="22" y="52" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Two ways to position an audience</text><rect x="110" y="86" width="220" height="220" fill="none" stroke="#E2E2E2"/><line x1="220.0" y1="86" x2="220.0" y2="306" stroke="#E2E2E2"/><line x1="110" y1="196.0" x2="330" y2="196.0" stroke="#E2E2E2"/><text x="165.0" y="135.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">ASPIRATION</text><text x="165.0" y="157.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">'I wish that</text><text x="165.0" y="169.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">were me' —</text><text x="275.0" y="135.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">RECOGNITION</text><text x="275.0" y="157.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">'that's me' —</text><text x="275.0" y="169.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">creates a bond</text><text x="165.0" y="245.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">IRRELEVANCE</text><text x="165.0" y="267.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">neither wanted</text><text x="165.0" y="279.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">nor recognised</text><text x="275.0" y="245.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="middle" font-weight="700" font-style="">BANALITY</text><text x="275.0" y="267.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">familiar but</text><text x="275.0" y="279.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">says nothing</text><text x="220.0" y="336" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="600" font-style="">how familiar the life on screen is</text><text x="88" y="196.0" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" font-weight="600" text-anchor="middle" transform="rotate(-90 88 196.0)">how the viewer responds</text><text x="22" y="364" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Comparison invites resistance. Recognition is rarer, harder to fake, and still gets through.</text></svg>