<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2E2E2E"/></marker></defs><rect width="640" height="300" rx="10" fill="#FAFAFA"/><text x="22" y="30" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="start" font-weight="600" font-style="">Push In</text><text x="22" y="50" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">Overhead view — a slow dolly toward the subject</text><circle cx="330" cy="165" r="13" fill="#141414"/><text x="330" y="197" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="700" font-style="">SUBJECT</text><g transform="translate(120,165) rotate(0) scale(0.9)"><rect x="-13" y="-9" width="20" height="18" rx="2.5" fill="#7A7A7A"/><path d="M7,-6 L16,-10 L16,10 L7,6 Z" fill="#7A7A7A"/></g><g transform="translate(235,165) rotate(0) scale(1)"><rect x="-13" y="-9" width="20" height="18" rx="2.5" fill="#2E2E2E"/><path d="M7,-6 L16,-10 L16,10 L7,6 Z" fill="#2E2E2E"/></g><line x1="146" y1="165" x2="212" y2="165" stroke="#2E2E2E" stroke-width="2" marker-end="url(#a)"/><text x="120" y="199" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">start</text><text x="235" y="199" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#2E2E2E" text-anchor="middle" font-weight="600" font-style="">end</text><rect x="470" y="110" width="34" height="26" fill="#8A8A8A" opacity="0.25"/><rect x="500" y="215" width="34" height="26" fill="#8A8A8A" opacity="0.25"/><text x="487" y="90" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">background shifts</text><text x="22" y="282" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">Gradually intensifies. The audience leans in without noticing they are being led — usually onto a realisation.</text></svg>