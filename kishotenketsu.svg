<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8A8A8A"/></marker></defs><rect width="800" height="400" rx="10" fill="#FAFAFA"/><text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#141414">Kishōtenketsu</text><text x="24" y="55" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8A8A8A">Four-act structure that works without conflict</text><rect x="32" y="96" width="170" height="116" rx="5" fill="#fff" stroke="#141414" stroke-width="1"/><text x="117.0" y="134" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="middle" font-weight="700" font-style="">KI 起</text><text x="117.0" y="158" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" font-weight="600" font-style="">Introduction</text><text x="117.0" y="234" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">Establish a situation.</text><text x="117.0" y="249" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style=""></text><line x1="208" y1="154.0" x2="216" y2="154.0" stroke="#8A8A8A" stroke-width="1.4" marker-end="url(#a)"/><rect x="224" y="96" width="170" height="116" rx="5" fill="#fff" stroke="#141414" stroke-width="1"/><text x="309.0" y="134" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#141414" text-anchor="middle" font-weight="700" font-style="">SHŌ 承</text><text x="309.0" y="158" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" font-weight="600" font-style="">Development</text><text x="309.0" y="234" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">Deepen it — no conflict.</text><text x="309.0" y="249" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style=""></text><line x1="400" y1="154.0" x2="408" y2="154.0" stroke="#8A8A8A" stroke-width="1.4" marker-end="url(#a)"/><rect x="416" y="96" width="170" height="116" rx="5" fill="#fff" stroke="#2E2E2E" stroke-width="2"/><text x="501.0" y="134" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#2E2E2E" text-anchor="middle" font-weight="700" font-style="">TEN 転</text><text x="501.0" y="158" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#2E2E2E" text-anchor="middle" font-weight="600" font-style="">Twist</text><text x="501.0" y="234" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">Something unexpected and s</text><text x="501.0" y="249" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">eemingly unrelated.</text><line x1="592" y1="154.0" x2="600" y2="154.0" stroke="#8A8A8A" stroke-width="1.4" marker-end="url(#a)"/><rect x="608" y="96" width="170" height="116" rx="5" fill="#fff" stroke="#7A7A7A" stroke-width="2"/><text x="693.0" y="134" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#7A7A7A" text-anchor="middle" font-weight="700" font-style="">KETSU 結</text><text x="693.0" y="158" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#7A7A7A" text-anchor="middle" font-weight="600" font-style="">Conclusion</text><text x="693.0" y="234" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">Reconcile the two. Meaning</text><text x="693.0" y="249" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style=""> appears.</text><path d="M 420 264 C 420 298, 700 298, 700 268" fill="none" stroke="#7A7A7A" stroke-width="1.5" stroke-dasharray="4 4"/><text x="560" y="312" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#7A7A7A" text-anchor="middle" font-weight="600" font-style="">the audience reconciles these two — and that act IS the meaning</text><text x="24" y="352" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">No antagonist required. The engine is juxtaposition, not conflict — which is why it suits brands with no real enemy.</text></svg>