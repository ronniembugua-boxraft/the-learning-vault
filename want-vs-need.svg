<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" preserveAspectRatio="xMidYMid meet"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8A8A8A"/></marker></defs><rect width="800" height="410" rx="10" fill="#FAFAFA"/><text x="24" y="34" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" fill="#141414">Want vs Need</text><text x="24" y="55" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#8A8A8A">The engine of character change</text><circle cx="150" cy="150" r="34" fill="#141414"/><text x="150" y="212" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="700" font-style="">CHARACTER</text><line x1="192" y1="130" x2="600" y2="78" stroke="#2E2E2E" stroke-width="2.4" marker-end="url(#a)"/><line x1="192" y1="170" x2="600" y2="232" stroke="#7A7A7A" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="606" y="48" width="168" height="62" rx="6" fill="#fff" stroke="#2E2E2E" stroke-width="1.6"/><text x="690" y="70" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#2E2E2E" text-anchor="middle" font-weight="700" font-style="">THE WANT</text><text x="690" y="88" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">conscious · external</text><text x="690" y="102" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">drives PLOT</text><rect x="606" y="202" width="168" height="62" rx="6" fill="#fff" stroke="#7A7A7A" stroke-width="1.6"/><text x="690" y="224" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#7A7A7A" text-anchor="middle" font-weight="700" font-style="">THE NEED</text><text x="690" y="242" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">unconscious · internal</text><text x="690" y="256" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#8A8A8A" text-anchor="middle" font-weight="400" font-style="">drives THEME</text><line x1="690" y1="114" x2="690" y2="196" stroke="#8A8A8A" stroke-dasharray="3 3"/><text x="704" y="158" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" font-weight="700" font-style="">the gap =</text><text x="704" y="174" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="">where meaning lives</text><text x="24" y="300" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#141414" text-anchor="start" font-weight="600" font-style="">Pursuing the want forces confrontation with the need. The best endings make the character choose one.</text><text x="24" y="322" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8A8A8A" text-anchor="start" font-weight="400" font-style="italic">A film with a want and no need has events but no meaning — which is why it feels “about nothing.”</text><text x="24" y="350" font-family="-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#2E2E2E" text-anchor="start" font-weight="400" font-style="italic">In 60 seconds: dramatise the want visibly, and let the need surface in a single beat near the end.</text></svg>